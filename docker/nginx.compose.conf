# Compose-specific nginx server block.
#
# Identical in spirit to ../config/nginx/onion_api.conf, but the upstream targets
# the `api` service by name instead of 127.0.0.1, because under Docker Compose the
# app runs in a separate container on the internal `onion_net` network.
# Contains NO secrets — safe to commit.
server {
    listen 8080;
    server_name _;

    access_log off;

    location / {
        proxy_pass http://api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        send_timeout 20s;
    }
}
