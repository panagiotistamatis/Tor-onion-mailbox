# nginx reverse proxy for the Onion Mailbox API.
# Install to /etc/nginx/sites-available/onion_api.conf and symlink into
# sites-enabled/, then `nginx -t && systemctl reload nginx`.
#
# Privacy notes:
#   * Binds to 127.0.0.1 only -> not reachable from the public internet,
#     only via the Tor onion service.
#   * access_log is disabled so no per-request client trail is written to disk.
#   * Timeouts are relaxed to tolerate Tor's higher round-trip latency.

server {
    listen 127.0.0.1:8080;
    server_name _;

    access_log off;
    error_log /var/log/nginx/onion_api_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        send_timeout 20s;
    }
}
